apiVersion: batch/v1
kind: Job
metadata:
  name: db-setup
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app: db-setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: nexus-backend:local
          imagePullPolicy: Never
          command: ["python", "create_tables.py"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://nexus:$(POSTGRES_PASSWORD)@postgres:5432/nexus
